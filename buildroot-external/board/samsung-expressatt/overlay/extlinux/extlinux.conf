timeout 1
default buildroot
menu title Samsung Express Linux

label buildroot
    kernel /boot/zImage
    fdt /boot/qcom-msm8960-samsung-expressatt.dtb
    append console=tty0 console=ttyMSM0,115200n8 earlycon loglevel=7 fbcon=font:VGA8x16 lk2nd.pass-simplefb=autorefresh lk2nd.pass-ramoops clk_ignore_unused pd_ignore_unused regulator_ignore_unused watchdog.open_timeout=60 root=PARTLABEL=userdata rootfstype=ext2 rootwait rw
