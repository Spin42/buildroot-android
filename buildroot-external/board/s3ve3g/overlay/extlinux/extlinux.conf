# Read by lk2nd (lk2nd/boot/extlinux.c) from the first ext2 filesystem it mounts: this image,
# flashed to userdata. Absolute paths are relative to this filesystem's root, relative ones to
# /extlinux. lk2nd needs a separate fdt (it patches memory, cmdline and ramoops into it) and
# boots the default label without a menu; every line needs a value.
# reboot=warm: the reboot-mode magic in IMEM must survive the reset to reach the Samsung aboot.
default s3ve3g
label s3ve3g
	linux /boot/zImage
	fdt /boot/qcom-msm8226-samsung-s3ve3g.dtb
	append console=tty0 loglevel=8 clk_ignore_unused pd_ignore_unused panic=10 reboot=warm lk2nd.pass-ramoops root=PARTLABEL=userdata rootfstype=ext2 rootwait ro
