# wpa_supplicant for wlan0 (wcn36xx). Not started at boot. To connect:
#   1. add a network block below, e.g. from: wpa_passphrase "<ssid>" "<passphrase>"
#   2. wpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant.conf
#   3. udhcpc -i wlan0
# Control with wpa_cli -i wlan0 (status, scan, scan_results).
ctrl_interface=/var/run/wpa_supplicant
update_config=1
# Two-letter country code (ISO 3166); without it the world regulatory domain applies.
#country=XX

#network={
#	ssid="example"
#	psk="passphrase"
#}
