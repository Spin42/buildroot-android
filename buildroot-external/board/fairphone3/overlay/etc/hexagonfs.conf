# HexagonFS configuration for Fairphone 3 (sdm632)
#
# Sourced by /etc/init.d/S28hexagonfs

# HexagonFS path used by tqftpserv / hexagonrpcd
HEXFS="/usr/share/qcom/sdm632/Fairphone/fp3"

# Android partition devices
DEV_VENDOR="/dev/mmcblk0p32"
DEV_PERSIST="/dev/mmcblk0p34"
DEV_DSP="/dev/mmcblk0p13"

# Mount points
MNT_VENDOR="/mnt/vendor"
MNT_PERSIST="/mnt/persist"
MNT_DSP="/mnt/dsp"

# Where vendor files live once mounted (acdbdata, sensors, etc.)
# On FP3 there is a dedicated vendor partition.
VENDOR_ROOT="/mnt/vendor"

# Platform type for socinfo defaults
HW_PLATFORM="MTP"
