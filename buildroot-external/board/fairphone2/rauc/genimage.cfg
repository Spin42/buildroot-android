# Image for the userdata partition of the RAUC configuration, with its own
# partition table. The partition numbers are used by boot.cmd and by the
# initramfs (/dev/loop0pN).

image boot.vfat {
	vfat {
		files = { "boot.scr" }
	}
	size = 16M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 256M
}

image userdata-rauc.img {
	hdimage {
		partition-table-type = "gpt"
		align = 1M
	}

	# 1: boot.scr, the RAUC slot selection
	partition boot {
		image = "boot.vfat"
	}

	# 2, 3: the root filesystems of slots A and B
	partition rootfs-a {
		image = "rootfs.ext4"
		size = 512M
	}

	partition rootfs-b {
		image = "rootfs.ext4"
		size = 512M
	}

	# 4: RAUC state, a U-Boot environment blob (fw_env.config)
	partition rauc-env {
		size = 1M
	}

	# 5: persistent data, mounted on /data
	partition data {
		image = "data.ext4"
	}
}
