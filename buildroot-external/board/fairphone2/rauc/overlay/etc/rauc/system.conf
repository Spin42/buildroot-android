[system]
compatible=fairphone2-buildroot
bootloader=uboot
statusfile=/data/rauc.status

[keyring]
path=/etc/rauc/keyring.pem

# The userdata image, attached to /dev/loop0 by the initramfs
[slot.rootfs.0]
device=/dev/loop0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/loop0p3
type=ext4
bootname=B
