%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/superpix,sp2508.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SuperPix SP2508 1/5" 2 Megapixel raw CMOS image sensor

maintainers:
  - Marc Lainez <marc.lainez@gmail.com>

description:
  The SuperPix SP2508 is a 2 Megapixel CMOS image sensor with a 10-bit raw
  Bayer output sent over MIPI CSI-2. It is programmed through an I2C interface
  with 8-bit register addresses split in pages. The driver supports one
  CSI-2 data lane.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: superpix,sp2508

  reg:
    const: 0x3c

  clocks:
    description:
      External clock (MCLK), 24 MHz, provided by the camera subsystem node.
    maxItems: 1

  clock-names:
    items:
      - const: xclk

  clock-frequency:
    description:
      Frequency of the external clock in Hz. When absent the rate of the
      clock provider is used.
    const: 24000000

  avdd-supply:
    description: Analogue supply, 2.8 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  reset-gpios:
    description: Reset line, asserted by logical 1 (physically active low).
    maxItems: 1

  powerdown-gpios:
    description: Power-down line, asserted by logical 1 (active high).
    maxItems: 1

  orientation: true

  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - avdd-supply
  - dovdd-supply
  - reset-gpios
  - powerdown-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@3c {
            compatible = "superpix,sp2508";
            reg = <0x3c>;
            clocks = <&camsys>;
            clock-names = "xclk";
            avdd-supply = <&mt6323_vcama_reg>;
            dovdd-supply = <&mt6323_vcamio_reg>;
            reset-gpios = <&pio 53 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&pio 56 GPIO_ACTIVE_HIGH>;
            orientation = <1>;
            rotation = <0>;

            port {
                endpoint {
                    remote-endpoint = <&camsys_csi0_ep>;
                    data-lanes = <1>;
                    link-frequencies = /bits/ 64 <300000000>;
                };
            };
        };
    };

...
