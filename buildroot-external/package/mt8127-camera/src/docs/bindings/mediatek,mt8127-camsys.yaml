%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt8127-camsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8127 camera subsystem

maintainers:
  - Marc Lainez <marc.lainez@gmail.com>

description:
  The camera subsystem of the MT8127 consists of the sensor interface
  (SENINF) with its MIPI CSI-2 receivers and the ISP pass 1 that writes raw or
  YUV frames to memory. The node also provides the master clock (MCLK) of the
  image sensors. The ISP power domain, the image clock gates, the camera
  clock mux and the MIPI pad configuration are programmed through the register
  windows listed below, which are shared with other drivers and therefore not
  claimed as exclusive regions.

properties:
  compatible:
    const: mediatek,mt8127-camsys

  reg:
    items:
      - description: IMGSYS clock gates
      - description: ISP pass 1
      - description: Sensor interface (SENINF)
      - description: MIPI RX digital block
      - description: MIPI RX analog block
      - description: SPM, for the ISP power domain
      - description: TOPCKGEN, for the camera clock mux
      - description: GPIO controller, for the MIPI pad and MCLK pin mux

  reg-names:
    items:
      - const: imgsys
      - const: isp
      - const: seninf
      - const: mipi-rx
      - const: mipi-ana
      - const: spm
      - const: topckgen
      - const: gpio

  interrupts:
    maxItems: 1

  '#clock-cells':
    const: 0
    description: The single clock is the 24 MHz sensor master clock.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description: CSI-2 inputs, one per sensor.

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Rear sensor on CSI0, raw Bayer.

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

            required:
              - data-lanes
              - remote-endpoint

      port@1:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Front sensor on CSI1, YUV.

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

            required:
              - data-lanes
              - remote-endpoint

    anyOf:
      - required:
          - port@0
      - required:
          - port@1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - '#clock-cells'
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        camsys: camera@15000000 {
            compatible = "mediatek,mt8127-camsys";
            reg = <0 0x15000000 0 0x1000>,
                  <0 0x15004000 0 0x4000>,
                  <0 0x15008000 0 0x1000>,
                  <0 0x1500c000 0 0x1000>,
                  <0 0x10010800 0 0x100>,
                  <0 0x10006000 0 0x1000>,
                  <0 0x10000000 0 0x1000>,
                  <0 0x10005000 0 0x1000>;
            reg-names = "imgsys", "isp", "seninf", "mipi-rx",
                        "mipi-ana", "spm", "topckgen", "gpio";
            interrupts = <GIC_SPI 143 IRQ_TYPE_LEVEL_LOW>;
            #clock-cells = <0>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    camsys_csi0_ep: endpoint {
                        remote-endpoint = <&sp2508_ep>;
                        data-lanes = <1>;
                    };
                };

                port@1 {
                    reg = <1>;

                    camsys_csi1_ep: endpoint {
                        remote-endpoint = <&sp0a20_ep>;
                        data-lanes = <1>;
                    };
                };
            };
        };
    };

...
